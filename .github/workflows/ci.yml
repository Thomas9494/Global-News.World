name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build the country catalog
        run: npm run build:catalog
      - name: Test
        run: npm test

  # Feed health talks to the outside world, so it runs on a schedule and
  # reports — it never blocks a pull request. Outlets go down on their own time.
  feeds:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build:catalog
      - name: Check every outlet in the catalog
        run: npm run check:feeds -- --failures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-report
          path: data/feed-report.json

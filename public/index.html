<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Global News — World Map</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script src="sources.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#0052cc; --primary-dark:#003d99; --primary-lighter:#e8f0fe;
    --fg-1:#0f172a; --fg-2:#334155; --fg-3:#64748b; --fg-4:#94a3b8;
    --teal:#0d9488; --positive:#00c853;
    --border-card:1px solid rgba(15,23,42,.08);
    --shadow-sm:0 1px 2px rgba(17,24,39,.04),0 1px 3px rgba(17,24,39,.08);
    --shadow-md:0 4px 12px rgba(17,24,39,.08);
    --shadow-menu:0 16px 24px 2px rgba(0,0,0,.06),0 6px 30px 5px rgba(0,0,0,.05),0 8px 10px -5px rgba(0,0,0,.08);
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* dvh repeats each vh/% height: mobile browsers size vh against the viewport
     with the URL bar collapsed, so a pane measured in vh overflows the screen
     while the bar is showing. Older engines drop the dvh line and keep the first. */
  html,body{height:100%;overflow:hidden}
  html,body{height:100dvh}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--fg-1);background:#f4f8fc}
  a{color:var(--primary);text-decoration:none}
  a:hover{color:var(--primary-dark)}
  #map{position:absolute;inset:0;cursor:grab}
  #map:active{cursor:grabbing}
  svg{display:block}
  .graticule{fill:none;stroke:rgba(15,23,42,.045);stroke-width:.5}
  .country{fill:url(#landg);stroke:none;transition:filter .25s}
  .country:hover{filter:brightness(.95)}
  .country.has-news{fill:url(#newsg)}
  .country.has-news:hover{filter:brightness(.92)}
  .country.focused{fill:#7fa9e0}
  .borders{fill:none;stroke:#fff;stroke-width:.6;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
  .coast{fill:none;stroke:rgba(51,65,85,.28);stroke-width:.5;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
  #landgroup{filter:drop-shadow(0 12px 32px rgba(15,23,42,.14))}

  #markers{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .mdot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
    background:#fff;border:var(--border-card);border-radius:20px;padding:5px 12px 5px 8px;
    font-size:11.5px;font-weight:600;color:var(--fg-2);box-shadow:var(--shadow-md);cursor:pointer;
    pointer-events:auto;white-space:nowrap;transition:opacity .3s,box-shadow .2s}
  .mdot:hover{box-shadow:0 12px 24px rgba(0,0,0,.15);color:var(--primary)}
  .mdot .d{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(0,82,204,.15);flex:none}
  .cdot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .cdot .l{font-size:10px;font-weight:600;color:var(--fg-1);background:rgba(255,255,255,.88);
    border-radius:8px;padding:1px 7px;box-shadow:var(--shadow-sm);white-space:nowrap}
  .cdot .d{width:11px;height:11px;border-radius:50%;background:var(--primary);border:2px solid #fff;
    animation:glowpulse 2.4s var(--ease) infinite}
  @keyframes glowpulse{0%{box-shadow:0 0 0 0 rgba(0,82,204,.45)}70%{box-shadow:0 0 0 12px rgba(0,82,204,0)}100%{box-shadow:0 0 0 0 rgba(0,82,204,0)}}
  /* ---- top bar ---- */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:50;background:#fff;
    box-shadow:inset 0 -1px 0 0 #dce1e7, 0 4px 12px rgba(17,24,39,.06);padding:6px 24px 6px;pointer-events:auto;
    /* Panning is fine, pinching is not: a two-finger zoom meant for the map that
       lands on the header would otherwise be handled by the browser and scale
       the whole document, header included. The map keeps its own pinch — this
       only refuses the gesture where it was never intended to start. */
    touch-action:pan-x pan-y}
  .tbrow{display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;flex:none;margin-right:8px;
    /* Collapsed rather than display:none while a query is active, so the field
       glides into the middle instead of jumping there. max-width animates;
       display does not. */
    max-width:200px;overflow:hidden;
    transition:max-width .35s var(--ease),opacity .25s,margin-right .35s var(--ease)}
  /* A query takes over the header: the wordmark steps aside and the field centres
     itself. Clearing the field brings the logo back. Driven by syncClear(). */
  .topbar.searching .brand{max-width:0;opacity:0;margin-right:0}
  .brand .gmark{flex:none}
  .brand .bword{display:flex;flex-direction:column;line-height:1.05}
  .brand .bword b{font-size:14px;font-weight:700;letter-spacing:.10em;color:#fff}
  .brand .bword span{font-size:9.5px;font-weight:600;letter-spacing:.42em;color:#8fb6e7;margin-top:2px}
  .searchwrap{flex:1;display:flex;justify-content:center}
  .searchbox{position:relative;width:min(560px,48vw);transition:width .35s var(--ease)}
  /* With the wordmark collapsed there is room to give the query more of the bar. */
  .topbar.searching .searchbox{width:min(680px,76vw)}
  .search{display:flex;align-items:center;gap:10px;background:#f4f7fb;border:1px solid #cbd5e1;
    border-radius:30px;padding:0 10px 0 18px;height:40px;transition:box-shadow .3s,border-color .3s,background .3s}
  .search:focus-within{background:#fff;box-shadow:0 4px 16px rgba(0,82,204,.14);border-color:rgba(0,82,204,.45)}
  .search svg{flex:none}
  .search input{flex:1;min-width:0;border:none;outline:none;font:inherit;font-size:15px;color:var(--fg-1);background:transparent}
  .search input::placeholder{color:var(--fg-4)}
  .iconbtn{flex:none;width:32px;height:32px;border:none;border-radius:50%;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--fg-3);transition:background .2s,color .2s}
  .iconbtn:hover{background:rgba(0,82,204,.08);color:var(--primary)}
  #qclear{display:none}
  #qclear.show{display:flex}
  .search .kbd{flex:none;font-size:11px;font-weight:600;color:var(--fg-4);border:1px solid #e2e8f0;
    border-radius:6px;padding:4px 7px;background:#f8fafc}
  /* country dropdown */
  .dropdown{position:absolute;top:56px;left:0;right:0;background:#fff;border:var(--border-card);
    border-radius:14px;box-shadow:var(--shadow-menu);overflow:hidden;opacity:0;transform:translateY(-6px);
    pointer-events:none;transition:opacity .25s,transform .25s var(--ease);max-height:min(420px,60vh);
    max-height:min(420px,60dvh)}
  .dropdown.open{opacity:1;transform:translateY(0);pointer-events:auto}
  .dropdown .dhead{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;
    letter-spacing:.06em;padding:12px 18px 6px}
  /* Budgeted off the container rather than given a second hard number: the two
     caps used to be set independently (380 vs 370) with the ~31px .dhead
     unaccounted for, so on a phone the list ran 21px past its own container and
     .dropdown{overflow:hidden} silently ate the last row. Deriving it means they
     cannot drift apart again. overflow-x is pinned because a lone overflow-y:auto
     computes the other axis to auto too — the same trap as .panel .pscroll. */
  .dropdown .dlist{overflow-y:auto;overflow-x:hidden;max-height:calc(100% - 2.2rem);
    padding-bottom:8px;-webkit-overflow-scrolling:touch}
  /* A row's text must be allowed to shrink, or a long country name refuses to
     go below its min-content width and wraps to three lines in a 264px menu. */
  .drow .dtext{min-width:0;flex:1}
  .drow .dname,.drow .dsub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow{display:flex;align-items:center;gap:12px;width:100%;border:none;background:#fff;font:inherit;
    text-align:left;padding:9px 18px;cursor:pointer;transition:background .2s,transform .2s}
  .drow:hover{background:#f6f9fe;transform:translateX(4px)}
  .drow:active{transform:scale(.98)}
  .drow .thumb{flex:none;width:46px;height:32px;background:#eef3f9;border:var(--border-card);border-radius:6px;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .drow .thumb svg{display:block}
  .drow .thumb path{fill:#7fa9e0;stroke:#fff;stroke-width:.6}
  .drow .thumb circle{fill:#7fa9e0;stroke:#fff;stroke-width:1}
  .drow .dname{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .drow .dname .dlive{font-size:9px;font-weight:700;color:var(--teal);background:rgba(13,148,136,.08);
    border-radius:8px;padding:2px 6px;letter-spacing:.06em;vertical-align:1px}
  .drow .dsub{font-size:12px;color:var(--fg-3);margin-top:1px}
  .drow .dgo{margin-left:auto;color:var(--fg-4);transition:color .2s}
  .drow:hover .dgo{color:var(--teal)}
  .dropdown .dnone{padding:14px 18px 18px;font-size:13px;color:var(--fg-3)}
  .live{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:12px;padding:12px 16px;font-size:13px;font-weight:600;color:#e2e8f0;white-space:nowrap}
  .live .dot{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.18)}

  /* ---- chips ---- */
  /* ---- topic text filters in header ---- */
  .chipshell{display:flex;align-items:center;gap:4px;margin-top:6px;padding-top:5px;overflow-x:auto;scrollbar-width:none;
    cursor:grab;-webkit-overflow-scrolling:touch;border-top:1px solid rgba(15,23,42,.06);
    /* Claim the horizontal axis so the JS drag-scroll and native momentum stop
       fighting over the same gesture. */
    touch-action:pan-x}
  .chipshell.dragging{cursor:grabbing;scroll-behavior:auto}
  .chipshell.dragging .tab{pointer-events:none}
  .chipshell::-webkit-scrollbar{display:none}
  .tab{position:relative;display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;
    border-radius:20px;cursor:pointer;color:var(--fg-3);font:inherit;font-size:13px;font-weight:600;
    padding:6px 14px;flex:none;white-space:nowrap;transition:background .25s,color .25s,transform .15s,border-color .25s}
  .tab svg{display:none}
  .tab:hover{background:var(--primary-lighter);color:var(--primary)}
  .tab:active{transform:scale(.97)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(0,82,204,.30)}
  .tab .tlbl{position:static;transform:none;opacity:1;background:transparent;color:inherit;padding:0;
    font-size:13px;font-weight:600;pointer-events:auto;transition:none}
  .tab .tlbl::before{display:none}
  .tab:hover .tlbl{transform:none}
  .tab .cnt{position:static;font-size:10px;font-weight:700;background:rgba(15,23,42,.08);
    color:var(--fg-3);border-radius:8px;padding:1px 6px;transition:background .25s,color .25s}
  .tab:hover .cnt{color:var(--primary)}
  .tab.active .cnt{background:var(--primary-lighter);color:var(--primary)}
  .topicwrap{display:none}
  .topicbtn{display:none}
  .topicpanel{display:none}
  .topicwrap{position:relative;display:none;pointer-events:auto}
  .topicbtn{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;font:inherit;
    font-size:13.5px;font-weight:600;border-radius:24px;padding:12px 18px;cursor:pointer;box-shadow:0 8px 20px rgba(0,82,204,.35)}
  .topicbtn .tcnt{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.25);border-radius:10px;padding:1px 7px}
  .topicpanel{position:absolute;bottom:54px;left:50%;transform:translate(-50%,8px);width:360px;max-width:92vw;
    background:#fff;border:var(--border-card);border-radius:16px;box-shadow:var(--shadow-menu);padding:8px;
    display:grid;grid-template-columns:1fr 1fr;gap:2px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
  .topicpanel.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .trowitem{display:flex;align-items:center;gap:8px;border:none;background:#fff;font:inherit;font-size:12.5px;
    font-weight:600;color:var(--fg-2);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;transition:background .2s,color .2s}
  .trowitem:hover{background:rgba(0,82,204,.07);color:var(--primary)}
  .trowitem.active{background:var(--primary);color:#fff}
  .trowitem .tcnt{margin-left:auto;font-size:10px;font-weight:700;background:rgba(15,23,42,.07);border-radius:8px;padding:1px 6px;color:var(--fg-3)}
  .trowitem.active .tcnt{background:rgba(255,255,255,.25);color:#fff}
  @media (max-width:1100px){ .topicwrap{display:none} }

  /* ---- zoom controls ---- */
  .zoomctrl{position:absolute;right:24px;bottom:96px;display:flex;flex-direction:column;background:#fff;
    border:var(--border-card);border-radius:12px;box-shadow:var(--shadow-md);overflow:hidden;z-index:30}
  .zoomctrl button{width:44px;height:44px;border:none;background:#fff;font-size:20px;color:var(--fg-2);
    cursor:pointer;transition:background .2s,color .2s}
  .zoomctrl button:hover{background:var(--primary-lighter);color:var(--primary)}
  .zoomctrl button+button{border-top:var(--border-card)}

  /* ---- hint ---- */
  .hint{position:absolute;left:28px;bottom:28px;z-index:25;background:#fff;border:var(--border-card);
    border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-sm);max-width:280px;
    transition:opacity .5s,transform .5s var(--ease)}
  .hint h4{font-size:13px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
  .hint p{font-size:12.5px;color:var(--fg-3);line-height:1.5}
  .hint.hide{opacity:0;transform:translateY(10px);pointer-events:none}

  /* ---- country markers ---- */
  .marker{cursor:pointer}
  @keyframes pulse{0%{r:4;opacity:.7}70%{r:14;opacity:0}100%{r:14;opacity:0}}
  .glow{fill:none;stroke:var(--primary);stroke-width:1.4;animation:pulse 2.4s var(--ease) infinite}
  .marker circle.core{fill:var(--primary);stroke:#fff;stroke-width:2}
  .marker text{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;fill:var(--fg-2);
    paint-order:stroke;stroke:#f4f8fc;stroke-width:3px;stroke-linejoin:round}
  .clabel{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;fill:rgba(15,23,42,.34);pointer-events:none;
    paint-order:stroke;stroke:rgba(255,255,255,.6);stroke-width:3px;stroke-linejoin:round;
    transition:opacity .3s}
  .clabel.has{font-size:15px;font-weight:700;letter-spacing:.16em;fill:rgba(15,23,42,.52)}
  .citydot{cursor:pointer}
  .citydot circle{fill:var(--primary);stroke:#fff;stroke-width:1.6}
  .citydot text{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;fill:var(--fg-1);
    paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3px;stroke-linejoin:round}
  .capital{transition:opacity .3s}
  .capital circle{fill:#334155;stroke:#fff;stroke-width:1.2}
  .capital circle.glow{fill:none;stroke:var(--primary);stroke-width:1.4}
  .capital text{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:500;fill:var(--fg-3);
    paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2.5px;stroke-linejoin:round}
  .major{transition:opacity .3s}
  .major circle{fill:var(--primary);stroke:#fff;stroke-width:1}
  .major circle.glow{fill:none;stroke:var(--primary);stroke-width:1.2}
  .major text{font-family:'Inter',sans-serif;font-size:9px;font-weight:500;fill:var(--fg-3);
    paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2.5px;stroke-linejoin:round}

  /* ---- news popups ---- */
  #cards{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  .newscard{position:absolute;width:250px;background:#fff;border:var(--border-card);border-radius:12px;
    box-shadow:var(--shadow-menu);overflow:hidden;pointer-events:auto;cursor:pointer;
    opacity:0;transform:translateY(14px) scale(.94);
    animation:cardin .55s var(--ease) forwards;transition:transform .3s var(--ease),box-shadow .3s}
  .newscard:hover{transform:translateY(-6px) scale(1.02)!important;box-shadow:0 12px 24px rgba(0,0,0,.15);z-index:99!important}
  @keyframes cardin{to{opacity:1;transform:translateY(0) scale(1)}}
  .newscard img{width:100%;height:110px;object-fit:cover;display:block;background:#dee7f2}
  .newscard .body{padding:10px 12px 12px}
  .newscard .src{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--primary);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
  .newscard .src .lang{flex:none;font-size:9.5px;font-weight:700;color:var(--teal);background:rgba(13,148,136,.08);
    border-radius:8px;padding:2px 6px;letter-spacing:.05em}
  /* A view is topped up from elsewhere when the place itself is quiet, so a card
     that did not come from the place in the tag has to say where it did come
     from. Borrowed, never disguised. */
  .newscard .src .from{flex:none;min-width:0;font-size:9.5px;font-weight:700;color:var(--fg-3);
    background:rgba(15,23,42,.06);border-radius:8px;padding:2px 6px;letter-spacing:.03em;
    text-transform:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .newscard .src .tag{margin-left:auto;color:var(--fg-4);font-weight:600;text-transform:none;letter-spacing:0;white-space:nowrap}
  .newscard h3{font-size:13.5px;font-weight:600;line-height:1.35;letter-spacing:-.01em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .newscard p{font-size:12px;color:var(--fg-3);line-height:1.45;margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .countrytag{position:absolute;pointer-events:none;z-index:21;background:var(--fg-1);color:#fff;
    font-size:12px;font-weight:600;border-radius:20px;padding:7px 14px;box-shadow:var(--shadow-md);
    opacity:0;animation:cardin .4s var(--ease) forwards;white-space:nowrap}
  .countrytag span{color:#94a3b8;font-weight:500}
  .morechip{position:absolute;pointer-events:auto;z-index:22;background:#fff;border:var(--border-card);
    border-radius:20px;padding:8px 16px;font:inherit;font-size:12.5px;font-weight:600;color:var(--primary);
    box-shadow:var(--shadow-md);cursor:pointer;opacity:0;animation:cardin .45s var(--ease) forwards;
    transition:background .2s}
  .morechip:hover{background:var(--primary-lighter)}
  /* Cards leaving on a "New News" press. A second animation rather than a
     transition, because .newscard's entry animation is animation-fill-mode
     forwards and would otherwise keep winning over any plain declaration. */
  @keyframes cardout{to{opacity:0;transform:translateY(8px) scale(.96)}}
  .newscard.out{animation:cardout .18s var(--ease) forwards}

  /* ---- New News ---- */
  /* The one deliberate act of curation on the map: drop the ten stories on
     screen and put up the next ten. Bottom centre is the only free strip of
     chrome — the hint sits left, the zoom controls right — and on a phone it
     rides above the bottom sheet. */
  .newsbtn{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:8px;
    background:var(--primary);color:#fff;border:none;font:inherit;font-size:13.5px;font-weight:600;
    border-radius:24px;padding:11px 20px;cursor:pointer;box-shadow:0 8px 20px rgba(0,82,204,.35);
    transition:background .25s,box-shadow .25s,opacity .25s}
  .newsbtn.show{display:inline-flex}
  .newsbtn:hover{background:var(--primary-dark);box-shadow:0 10px 26px rgba(0,82,204,.45)}
  .newsbtn:active{transform:translateX(-50%) scale(.97)}
  .newsbtn:disabled{background:#fff;color:var(--fg-4);border:var(--border-card);
    box-shadow:var(--shadow-sm);cursor:default}
  .newsbtn svg{flex:none}

  /* ---- article panel ---- */
  /* fixed, not absolute: a closed drawer is parked at translateX(105%), and an
     absolutely positioned box out there widens the document. Desktop hides that
     behind overflow:hidden, but iOS Safari ignores root overflow and lays the
     whole page out at ~2x the screen — which shifts the topbar, search, chips
     and map projection off to the right. Fixed boxes never extend the page. */
  .panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#fff;z-index:60;
    box-shadow:-12px 0 40px rgba(15,23,42,.12);transform:translateX(105%);
    transition:transform .5s var(--ease);display:flex;flex-direction:column}
  .panel.open{transform:translateX(0)}
  .panel .phead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:var(--border-card)}
  /* A long outlet name must ellipsis, not stretch the header past the screen. */
  .panel .phead .psrc{font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel .phead .ptime{font-size:12px;color:var(--fg-4);white-space:nowrap}
  .panel .phead button.pclose{margin-left:auto;width:36px;height:36px;border:var(--border-card);background:#fff;
    border-radius:50%;font-size:16px;color:var(--fg-3);cursor:pointer;transition:background .2s;flex:none}
  .panel .phead button.pclose:hover{background:var(--primary-lighter);color:var(--primary)}
  /* overflow-y:auto alone computes overflow-x to auto as well, so one too-wide
     child turns the whole article into a sideways-scrolling pane — which reads
     as the text being chopped off down its left edge. A reading panel scrolls
     one way only. */
  .panel .pscroll{overflow-y:auto;overflow-x:hidden;flex:1;-webkit-overflow-scrolling:touch}
  /* Nothing inside may force the panel wider than the phone. */
  .panel .pscroll *{max-width:100%}
  .panel .pbody{overflow-wrap:anywhere}
  .panel img.phero{width:100%;height:220px;object-fit:cover;display:block;background:#dee7f2}
  .panel .pbody{padding:22px 26px 34px}
  .panel .pcat{display:inline-block;font-size:11px;font-weight:700;color:var(--teal);background:rgba(13,148,136,.08);
    border-radius:20px;padding:4px 12px;margin-bottom:12px}
  .panel h2{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-bottom:8px;text-wrap:pretty}
  .panel .plede{font-size:15px;color:var(--fg-2);line-height:1.55;font-weight:500;margin-bottom:16px}
  .panel .ptext p{font-size:14px;color:var(--fg-2);line-height:1.65;margin-bottom:14px}
  .panel .porig{display:inline-flex;align-items:center;gap:8px;margin-top:6px;background:var(--primary);color:#fff;
    font-size:13.5px;font-weight:600;border-radius:8px;padding:12px 20px;transition:background .25s}
  .panel .porig:hover{background:var(--primary-dark);color:#fff}
  /* wrap: the only row in the article body that structurally could not, so a long
     country name had nowhere to go but shrink. */
  .pmeta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 16px;font-size:12px;color:var(--fg-4)}
  /* translation toggle */
  .ptrans{display:none;margin:0 0 16px;background:#f6f9fe;border:1px solid rgba(0,82,204,.14);border-radius:12px;padding:12px 14px}
  .ptrans.show{display:block}
  .ptrans .tlabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:10px}
  .ptrans .tlabel svg{color:var(--primary);flex:none}
  .tseg{display:inline-flex;background:#fff;border:var(--border-card);border-radius:20px;padding:3px}
  .tseg button{border:none;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--fg-3);
    padding:6px 14px;border-radius:16px;cursor:pointer;transition:background .25s,color .25s}
  .tseg button.active{background:var(--primary);color:#fff}
  .trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .trow select{font:inherit;font-size:12px;font-weight:600;color:var(--fg-2);background:#fff;
    border:var(--border-card);border-radius:8px;padding:7px 10px;outline:none;cursor:pointer}
  .tnote{font-size:11px;color:var(--fg-4);margin-top:8px}

  .noresult{position:absolute;background:#fff;border:var(--border-card);border-radius:12px;padding:12px 16px;
    font-size:12.5px;color:var(--fg-3);box-shadow:var(--shadow-sm);pointer-events:none;
    opacity:0;animation:cardin .4s var(--ease) forwards}
  .srcrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:var(--border-card)}
  .srcrow .sm{flex:1;min-width:0}
  .srcrow .sm b{font-size:13.5px;font-weight:600;color:var(--fg-1);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcrow .sm span{font-size:11.5px;color:var(--fg-4)}
  .srcrow .sl{flex:none;font-size:10px;font-weight:700;color:var(--teal);background:rgba(13,148,136,.08);border-radius:8px;padding:2px 7px}
  .srcrow a.slink{flex:none;font-size:12px;font-weight:600;color:var(--primary);border:1px solid rgba(0,82,204,.25);
    border-radius:8px;padding:4px 10px;transition:background .2s}
  .srcrow a.slink:hover{background:var(--primary-lighter)}
  .srcchip{position:absolute;pointer-events:auto;z-index:22;background:#fff;border:var(--border-card);
    border-radius:20px;padding:6px 14px;font:inherit;font-size:12px;font-weight:600;color:var(--teal);
    box-shadow:var(--shadow-md);cursor:pointer;opacity:0;animation:cardin .45s var(--ease) forwards;
    white-space:nowrap;transition:background .2s}
  .srcchip:hover{background:rgba(13,148,136,.08)}

  /* ---- mobile bottom sheet ---- */
  /* fixed for the same reason as .panel — parked at translateY(105%) it would
     otherwise add a screen's worth of page below the fold. */
  .msheet{position:fixed;left:0;right:0;bottom:0;z-index:35;display:none;background:#fff;
    border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.16);
    padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .45s var(--ease);touch-action:pan-y}
  .msheet.open{transform:translateY(0)}
  /* No transition while a finger is on the sheet — it must track the drag 1:1. */
  .msheet.dragging{transition:none}
  /* The handle is the drag target, so give it a finger-sized hit area. */
  .mgrabwrap{padding:2px 0 6px;cursor:grab;touch-action:none}
  .mgrab{width:40px;height:4px;border-radius:2px;background:#cbd5e1;margin:4px auto 8px}
  .mhead{display:flex;align-items:center;gap:8px;padding:0 16px 8px}
  .mhead b{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .mhead .mcnt{font-size:12px;color:var(--fg-4)}
  .mhead .msrc{margin-left:auto;border:1px solid rgba(13,148,136,.25);background:#fff;color:var(--teal);
    font:inherit;font-size:11.5px;font-weight:600;border-radius:16px;padding:4px 10px;cursor:pointer}
  /* Card width lives in a custom property so the centring padding below can be
     derived from the same number instead of guessing at it. */
  .mstrip{--card:min(78vw,300px);
    display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    /* Half the leftover width on each side, so the first and last card can
       reach the middle of the screen too. With a fixed 16px inset and
       snap-align:start the card sat ~29px left of centre at 390px, and further
       out as the screen grew — 154px off at the 640px breakpoint. */
    padding:2px calc((100% - var(--card)) / 2) 6px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .mstrip::-webkit-scrollbar{display:none}
  .mstrip .newscard{position:static;flex:none;width:var(--card);scroll-snap-align:center;
    animation:none;opacity:1;transform:none}
  .mstrip .mnone{font-size:12.5px;color:var(--fg-3);padding:10px 4px 14px}

  @media (max-width:640px){
    .topbar{padding:6px 12px}
    .tbrow{gap:10px}
    .brand svg{width:104px;height:30px}
    /* The wordmark is flex:none, so every pixel it takes is a pixel the search
       field loses. Below ~400px give some of it back. */
    @media (max-width:400px){ .brand svg{width:88px;height:26px} .brand{margin-right:4px} }
    .searchwrap{justify-content:stretch}
    .searchbox{width:100%}
    .search{height:38px;padding:0 6px 0 12px}
    /* 16px is a hard floor, not a taste choice: iOS Safari force-zooms the whole
       page when a focused field is smaller, and it stays zoomed after the
       keyboard closes — which is what "content too big", "cut off on both sides"
       and the sideways scrolling all were. Never drop either field below 16px. */
    .search input{font-size:16px}
    .trow select{font-size:16px}
    .search .kbd{display:none}
    .dropdown{max-height:min(380px,52vh);max-height:min(380px,52dvh)}
    .msheet{display:block}
    #cards .newscard, #cards .morechip{display:none}
    .countrytag{display:none}
    #cards .srcchip{display:none}
    .zoomctrl{right:12px;bottom:auto;top:calc(50% - 66px)}
    .hint{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:none}
    /* The sheet's height changes with its content, so app.js measures it and
       publishes it as --msheet-h rather than this guessing at a number. */
    body.msheet-open .newsbtn{bottom:calc(var(--msheet-h,220px) + 10px)}
    /* Once the sheet is up it owns the bottom of the screen — get the hint out
       of the way instead of letting the two stack on top of each other. */
    body.msheet-open .hint{opacity:0;transform:translateY(10px);pointer-events:none}
    .panel{width:100vw;max-width:100vw}
    .panel img.phero{height:150px}
    .panel .pbody{padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
    .panel h2{font-size:18px}
    .panel .phead{padding:12px 14px}
    /* The translation controls were laid out for a 440px desktop drawer. On a
       phone the segmented pair alone is wider than the column, so let it wrap
       and let the language select take a line of its own. */
    .ptrans{padding:10px;margin-bottom:12px}
    .trow{gap:6px}
    .tseg{display:flex;flex-wrap:wrap;width:100%}
    /* The label is built at runtime as "Original · <language>", so a long
       language name has to be allowed to wrap rather than clip out of the pill. */
    .tseg button{flex:1 1 auto;padding:6px 10px;white-space:normal}
    .srcrow{flex-wrap:wrap;gap:6px 10px}
    .trow select{width:100%;max-width:100%}
    /* Only 4 of 14 categories fit a phone, the scrollbar is suppressed and there
       was no fade — so nothing told the reader the other ten existed. The mask
       feathers the right edge while there is more to scroll to. */
    .chipshell{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
      mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
    /* ~30px tall was half a fingertip. */
    .tab{padding:9px 14px;font-size:13.5px}
    .mdot{font-size:11px;padding:4px 10px 4px 7px}
    /* Tapping a country pill is the main way in on a phone, but the pill itself
       is ~24px tall — half a fingertip. Widen the hit area, not the artwork. */
    .mdot::after{content:"";position:absolute;left:0;right:0;top:50%;
      height:44px;transform:translateY(-50%)}
  }
  /* A touch device has no pointer to move away, so :hover latches on after a tap
     and stays until the reader taps something else. A highlighted chip then looks
     selected when it isn't, and a lifted card stays lifted. Neutralise the ones
     that move or change fill; the no-op resets can stay as they are. */
  @media (hover:none){
    .tab:hover{background:transparent;color:var(--fg-3)}
    .tab.active:hover{background:var(--primary);color:#fff}
    .drow:hover{background:#fff;transform:none}
    .drow:hover .dgo{color:var(--fg-4)}
    .newscard:hover{transform:none!important;box-shadow:var(--shadow-menu);z-index:auto!important}
  }
  @media (prefers-reduced-motion: reduce){
    .newscard,.countrytag,.noresult,.morechip{animation:none;opacity:1;transform:none}
    .newscard.out{animation:none;opacity:0;transform:none}
    .glow{animation:none;opacity:0}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="markers"></div>
<div id="cards"></div>
<div class="msheet" id="msheet">
  <div class="mgrabwrap" id="mgrabwrap" role="button" tabindex="0" aria-label="Close news panel">
    <div class="mgrab"></div>
  </div>
  <div class="mhead" id="mhead"></div>
  <div class="mstrip" id="mstrip"></div>
</div>

<div class="topbar">
  <div class="tbrow">
  <div class="brand" title="Global News">
    <svg width="140" height="40" viewBox="0 0 250 72" role="img" aria-label="Global News">
      <text x="18" y="42" font-family="Inter, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#0f172a">gl<tspan fill="#0052cc">o</tspan>bal news</text>
      <path d="M 52 30 A 8.4 8.4 0 0 1 68.8 30" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"></path>
      <line x1="18" y1="56" x2="120" y2="56" stroke="#0052cc" stroke-width="4"></line>
      <line x1="126" y1="56" x2="140" y2="56" stroke="#dc2626" stroke-width="4"></line>
    </svg>
  </div>
  <div class="searchwrap">
    <div class="searchbox">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <input id="q" type="text" placeholder="Pick a country or search topics, outlets …"
               data-placeholder-narrow="Search a country or topic" autocomplete="off">
        <button class="iconbtn" id="qclear" title="Clear search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
        <button class="iconbtn" id="qdrop" title="Show countries">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <span class="kbd">⌘K</span>
      </div>
      <div class="dropdown" id="dropdown">
        <div class="dhead">Countries</div>
        <div class="dlist" id="dlist"></div>
      </div>
    </div>
  </div>
  </div>
  <div class="chipshell" id="chips"></div>
</div>

<div class="zoomctrl">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">−</button>
  <button id="zreset" title="World view" style="font-size:14px">⌂</button>
</div>

<button class="newsbtn" id="newnews" type="button">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"></path><path d="M20.5 3.5V6.5h-3"></path></svg>
  New News
</button>

<div class="hint" id="hint">
  <h4>Zoom into a country</h4>
  <p id="hinttext">Use the mouse wheel to zoom in and out. Once you're close enough to a country, the latest stories from its local newspapers pop up — no country restrictions, translated on click.</p>
</div>

<aside class="panel" id="spanel">
  <div class="phead">
    <span class="psrc" id="s-title"></span><span class="ptime" id="s-count"></span>
    <button class="pclose" id="s-close" title="Close">✕</button>
  </div>
  <div class="pscroll"><div class="pbody" id="s-list"></div></div>
</aside>

<aside class="panel" id="panel">
  <div class="phead">
    <span class="psrc" id="p-src"></span><span class="ptime" id="p-time"></span>
    <button class="pclose" id="p-close" title="Close">✕</button>
  </div>
  <div class="pscroll">
    <img class="phero" id="p-img" alt="">
    <div class="pbody">
      <span class="pcat" id="p-cat"></span>
      <div class="ptrans" id="ptrans">
        <div class="tlabel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h8M8 3v2m3 0c-1 5-4 8-7 10m2-5c1 2 3 4 6 5"></path><path d="M13 21l4-9 4 9m-7-2.5h6"></path></svg>
          Automatic translation
        </div>
        <div class="trow">
          <div class="tseg">
            <button id="t-de">Translation</button>
            <button id="t-orig"></button>
          </div>
          <select id="t-target" title="Target language">
            <option value="de" selected>→ Deutsch (German)</option>
            <option value="en" disabled>→ English — coming soon</option>
            <option value="fr" disabled>→ Français — coming soon</option>
            <option value="es" disabled>→ Español — coming soon</option>
            <option value="it" disabled>→ Italiano — coming soon</option>
          </select>
        </div>
        <div class="tnote" id="tnote"></div>
      </div>
      <h2 id="p-title"></h2>
      <div class="pmeta"><span id="p-country"></span><span>·</span><span id="p-read"></span></div>
      <p class="plede" id="p-lede"></p>
      <div class="ptext" id="p-text"></div>
      <a class="porig" href="#" onclick="return false">Read original article
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M8 7h9v9"></path></svg>
      </a>
    </div>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
